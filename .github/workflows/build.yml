name: Build plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Pack bilgisini jar icine yaz
        run: |
          SHA1=$(sha1sum pack/GaunCraft-Pack.zip | cut -d' ' -f1)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/pack-latest/GaunCraft-Pack.zip"
          printf 'url=%s\nsha1=%s\n' "$URL" "$SHA1" > src/main/resources/pack.properties
          cat src/main/resources/pack.properties

      - name: Jar derle
        run: mvn -B package

      - name: Jar dosyasini artifact olarak yukle
        uses: actions/upload-artifact@v4
        with:
          name: GaunCraftPack
          path: target/GaunCraftPack.jar

      - name: Release olustur (pack zip + jar)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete pack-latest --cleanup-tag --yes || true
          gh release create pack-latest pack/GaunCraft-Pack.zip target/GaunCraftPack.jar \
            --title "GaunCraft Pack (son surum)" \
            --notes "Otomatik olusturuldu. GaunCraftPack.jar plugins klasorune atilir." \
            --target "$GITHUB_SHA"
